# Queryfolio 設定ファイルのサンプル。
# ~/.config/queryfolio/config.yml (または config.yaml) に置く。
#
# 開発・テスト用に QUERYFOLIO_CONFIG_YAML 環境変数でこのファイル全体の内容を
# 上書きできる (GUI を Finder / Dock から起動した場合、shell の環境変数は渡らない)。

# --- servers (接続定義。各エントリの形式は sql-agent-mcp-server 互換) ---
#
# 注意: このキーは以前 sql_servers という名前だった (server_templates も
# 旧名 sql_server_templates)。旧名のままだと起動時にエラーになる。

servers:
  - name: dev-postgres
    description: "開発環境の PostgreSQL サーバー"
    engine: postgres
    host: localhost
    port: 5432
    schema: development_db
    user: dev_user
    password: your_password_here

  - name: dev-mysql
    description: "開発環境の MySQL サーバー"
    engine: mysql
    host: localhost
    port: 3306
    schema: test_db
    user: mysql_user
    password: your_mysql_password

  # --- SQL エンジン (mysql / postgres) の TLS ---
  #
  # 重要: ssl_mode も tls も指定しない直接接続は sqlx の既定 (prefer) で動く。
  # prefer は「TLS を試み、張れなければ平文へ降格する。張れてもサーバー証明書を
  # 検証しない」ため、経路上の攻撃者に盗聴・改竄されうる。
  # インターネット越しに直接つなぐ接続 (RDS 等) では必ず tls: true か
  # ssl_mode を指定すること。接続をホバーすると詳細に TLS の値が出る。
  #
  # tls: true         → ssl_mode 省略時の既定が verify-full になる
  # ssl_mode:         → disable / prefer / require / verify-ca / verify-full
  #                      (tls より優先。MySQL の verify-full は VerifyIdentity)
  # ssl_root_cert:    → 自己署名 CA を使う場合のルート証明書 (PEM)。~ 展開あり。
  #                      検証しないモード (disable / prefer / require) と併記すると
  #                      黙って無視されるため設定エラーにしている
  #                      (verify-ca / verify-full を指定すること)
  #
  # SSH トンネル経由の接続は接続先が 127.0.0.1 になるため、verify-full は
  # 証明書のホスト名検証で失敗する。トンネル自体が暗号化されているので
  # 指定しない (prefer のまま) か require までに留める。
  - name: prod-postgres
    description: "本番 PostgreSQL (TLS 必須 + 証明書検証)"
    engine: postgres
    host: db.example.com
    port: 5432
    schema: production_db
    user: readonly_user
    password: your_password_here
    readonly: true
    tls: true
    # ssl_mode: verify-full
    # ssl_root_cert: ~/.config/queryfolio/certs/rds-ca.pem

  # queryfolio 拡張: sqlite は schema に DB ファイルパスを指定する
  - name: local-sqlite
    description: "ローカルの SQLite ファイル"
    engine: sqlite
    schema: ~/data/example.sqlite3

  # queryfolio 拡張: duckdb は sqlite と同じく schema に DB ファイルパスを
  # 指定する (ファイルが存在しない場合はエラー。新規作成はしない)。
  # SQL エンジンとして SELECT / メタコマンド / EXPLAIN / auto LIMIT が使える。
  - name: local-duckdb
    description: "ローカルの DuckDB ファイル"
    engine: duckdb
    schema: ~/data/example.duckdb

  # queryfolio 拡張: redis (エイリアス: valkey)。
  # エディタは 1 行 = 1 コマンド (GET my-key / MGET a b c ...)。
  # schema は database 番号 (省略時 0)。user / password は ACL / AUTH に使う。
  # SSH トンネルも SQL エンジンと同様に使える。
  # tls: true (queryfolio 拡張、省略時 false) で TLS 接続 (rediss://) になる。
  # 証明書は常に検証する (システムの信頼ストア)。SSH トンネル経由では接続先が
  # 127.0.0.1 になりホスト名検証に失敗するため、併用しないこと。
  - name: local-redis
    description: "ローカルの Redis"
    engine: redis
    host: localhost
    port: 6379
    schema: "0"
    # tls: true

  # queryfolio 拡張: elasticsearch (エイリアス: es / opensearch)。
  # エディタは Kibana Console 風のリクエストブロック
  # (`GET /index/_search` のメソッド行 + JSON body。# 行はコメント)。
  # user / password は Basic 認証に使う。SSH トンネルも SQL エンジンと同様。
  # tls: true (queryfolio 拡張、省略時 false) で https 接続になる。
  - name: local-elasticsearch
    description: "ローカルの Elasticsearch"
    engine: elasticsearch
    host: localhost
    port: 9200
    # tls: true
    # user: elastic
    # password: your_es_password

  # queryfolio 拡張: dynamodb。PartiQL (SQL 互換サブセット) を
  # ExecuteStatement API で実行する。エディタは SQL (SELECT / INSERT / UPDATE /
  # DELETE。PartiQL に LIMIT 句は無く、行数はアプリ側の上限で抑える)。
  # schema = AWS リージョン (必須)。認証は次の順で解決する:
  #   1. user / password (静的なアクセスキー ID / シークレットアクセスキー)
  #   2. aws_profile (queryfolio 拡張。~/.aws のプロファイル名)
  #   3. 既定の credentials chain (環境変数 → default プロファイル → IMDS)
  - name: aws-dynamodb
    description: "AWS の DynamoDB (ap-northeast-1)"
    engine: dynamodb
    schema: ap-northeast-1
    # aws_profile: my-profile
    # readonly: true   # SELECT のみ許可したい場合

  # dynamodb-local (docker run -p 8000:8000 amazon/dynamodb-local) の例。
  # host / port でエンドポイントを上書きする (tls: true で https)。
  # dynamodb-local は認証を検証しないため user / password はダミーでよい
  # (英数字のみ。dynamodb-local はハイフン等を含むキーを拒否する)。
  - name: local-dynamodb
    description: "ローカルの dynamodb-local"
    engine: dynamodb
    schema: us-east-1
    host: 127.0.0.1
    port: 8000
    user: dummyAccessKey
    password: dummySecretKey

  # queryfolio 拡張: readonly: true (省略時 false) を指定すると、
  # 書き込み系の文 (INSERT / UPDATE / DELETE / DDL、CTE 付き DML、
  # SELECT INTO 等) の実行を拒否する。
  # SELECT に副作用のある関数 (nextval 等) までは防げない。
  # あくまで事故防止のガード。
  - name: production-replica
    description: "本番レプリカ (読み取り専用)"
    engine: mysql
    host: replica.example.com
    port: 3306
    schema: production_db
    user: replica_user
    password: replica_password
    readonly: true

  # queryfolio 拡張: allow_dangerous_statements (省略時 false)。
  # 省略時は、危険な文 (WHERE 無しの UPDATE / DELETE、DROP、TRUNCATE) を
  # 誤操作による全行破壊・テーブル消失防止のため拒否する。
  # true にするとこれらの文を実行できるが、実行前に確認ダイアログが出る。
  - name: dev-db
    description: "開発用 DB (危険な文も確認の上で実行できる)"
    engine: postgres
    host: localhost
    port: 5432
    schema: dev
    user: dev_user
    password: dev_password
    allow_dangerous_statements: true

  - name: remote-db-with-ssh
    description: "SSH トンネル経由でアクセスするリモートデータベース"
    engine: postgres
    host: localhost  # SSH トンネル経由の場合、踏み台から見た DB ホストを指定
    port: 5432
    schema: remote_db
    user: remote_user
    password: remote_password
    ssh_tunnel:
      host: ssh.example.com
      port: 22
      user: ssh_user
      # password: ssh_password  # または private_key_path を使用
      private_key_path: ~/.ssh/id_rsa
      # private_key_passphrase: key_passphrase
      # When no password/private_key_path is set, the SSH agent is used.
      # The agent socket is resolved from ~/.ssh/config (IdentityAgent) and
      # then SSH_AUTH_SOCK. Override it here if the app is launched in an
      # environment that does not inherit the right socket (e.g. the
      # 1Password SSH agent when launched from Finder). "none" disables the agent.
      # identity_agent: ~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock

  - name: remote-db-via-ssh-config
    description: "~/.ssh/config の Host エイリアスで接続 (ProxyJump / 多段トンネル対応)"
    engine: postgres
    host: localhost  # 踏み台 (ssh_config の最終ホスト) から見た DB ホスト
    port: 5432
    schema: remote_db
    user: remote_user
    password: remote_password
    ssh_tunnel:
      # queryfolio extension: delegate the tunnel to the system `ssh` client
      # using this ~/.ssh/config Host alias. HostName / User / Port / ProxyJump
      # (multi-hop) are all resolved by OpenSSH, so a config like
      #   Host pop-three-ec2-staging
      #       HostName 172.21.122.39
      #       User torico
      #       ProxyJump pop-three-bastion
      # just works by naming the alias here. host / user / private_key_path /
      # identity_agent above are ignored in this mode (auth and host-key
      # checking are handled entirely by OpenSSH).
      ssh_config: pop-three-ec2-staging

# --- servers: グループ機能 (queryfolio 拡張) ---
# リスト項目に group_name + servers を書くと、その中のサーバーが
# 接続一覧でグループ見出し付きで表示される。直書きサーバーとの混在も可
# (設定した順序のまま表示される)。グループの中にさらにグループは書けない。
# グループ内でも template: による雛形継承は使える。
#
# servers:
#   - group_name: production
#     servers:
#       - name: prod-main
#         engine: mysql
#         host: prod.example.com
#         ...
#       - name: prod-replica
#         engine: mysql
#         host: replica.example.com
#         ...
#   - group_name: development
#     servers:
#       - name: dev-db
#         engine: postgres
#         host: localhost
#         ...
#   - name: ungrouped-db   # グループ無しの直書きも混在できる
#     engine: sqlite
#     schema: ~/data/example.sqlite3

# --- servers: 接続時にパスワードを取得する (password_command、queryfolio 拡張) ---
# password の代わりに password_command を書くと、その接続を開く時にコマンドを
# 実行し、stdout (末尾の改行を除く) をパスワードとして使う。設定の読み込み時や
# 接続を選択しただけでは実行せず、他の接続の分も実行しない。
# RDS の IAM 認証トークン (有効 15 分) のような期限付きの資格情報向け。
#
# - password との併記はエラー (テンプレートの password を打ち消すなら password: null)
# - sqlite / duckdb では使えない (パスワードを使わないため)
# - postgres / mysql は認証エラー (期限切れ) になると、コマンドを実行し直して
#   1 度だけ再試行する (SSH トンネルとプールはそのまま)
# - コマンドはシェル非経由で実行される (パイプやリダイレクトは使えない。
#   必要ならラッパースクリプトを書く)。タイムアウトは 60 秒
#
# servers:
#   - name: staging-iam
#     engine: postgres
#     host: mydb.example.com
#     port: 5432
#     schema: appdb
#     user: iam_user
#     password_command: aws rds generate-db-auth-token --hostname mydb.example.com --port 5432 --username iam_user --region us-east-1 --profile staging
#     ssl_mode: require
#     ssh_tunnel:
#       host: bastion.example.com
#       user: ec2-user
#       private_key_path: ~/.ssh/id_rsa

# --- 設定を外部から上書きする (任意) ---
# config_override_command に書いたコマンドを実行し、その stdout (YAML) を
# この設定へ再帰的にマージする。取得した YAML 側が優先。
#
# マージ規則:
#   - マッピング同士は再帰的に混ざる (例: ai の api_key だけ差し替え)
#   - スカラーとリスト (servers を含む) は丸ごと置き換わる
#   - servers に限らずどのキーでも上書きできる
#
# 取得した YAML の中に config_override_command があっても再帰取得はしない。
# コマンドはシェル非経由で実行される (パイプやリダイレクトは使えない)。
#
# 1Password から取得する例:
# config_override_command: op read "op://development/queryfolio/config-yaml"

# --- 接続情報の雛形 ---
# servers 側で template: <名前> を指定して継承できる。
# サーバー側で指定したキーはテンプレートの同名キーを上書きする (シャローマージ)。
server_templates:
  - name: my-awesome-sql-host
    engine: mysql
    host: db.example.com
    port: 3306
    user: shared_user
    password: shared_password

# --- AI (自然言語 → SQL 生成) の設定 (任意) ---
# ここ (ローカル config.yml のトップレベル)、または config_override_command で
# 取得する YAML のトップレベルに書ける。マージの結果、取得 YAML 側が優先される
# (API キーを 1Password 内の YAML に置けば、ローカルに平文で残らない)。
# ai:
#   provider: openai   # 現状 openai のみ対応
#   api_key: sk-your-api-key
#   model: gpt-6-luna     # 任意 (省略時 gpt-6-luna)
#   base_url: https://api.openai.com/v1  # 任意 (OpenAI 互換 API 用)
#   # AI チャットは function calling を使う。gpt-6-luna 等の推論モデルは
#   # /v1/chat/completions で tools を使う場合 reasoning_effort が "none" でないと
#   # エラーになるため、接続先が OpenAI 公式なら省略時に "none" を送る。
#   # base_url で OpenAI 互換 API を指している場合は、明示指定した時だけ送る
#   # (このパラメータを受け付けない相手を勝手に壊さないため)。
#   # 空文字を指定すると常に送らない。
#   # なお reasoning_effort が原因で拒否された場合は、そのパラメータを外して
#   # 自動で 1 度だけ再送するため、受け付けないモデルでも設定変更なしで動く。
#   # ただし gpt-6-astra は "none" を受け付けず、外すと tools 併用の制約で拒否される
#   # ため、AI チャットには使えない (SQL 生成 / EXPLAIN 解説は tools を使わない)。
#   tool_reasoning_effort: none   # 任意 ("" で送らない)

# --- LIMIT 未指定の SELECT に自動付与する行数上限 (任意。デフォルト 500、0 で無効) ---
# default_limit: 500

# --- クエリファイルの保存先 (任意。デフォルト ~/.config/queryfolio/sqlfiles) ---
# sqlfiles_dir: ~/queries
#
# 相対パスを書いた場合は、カレントディレクトリではなく設定ディレクトリ
# (~/.config/queryfolio) を基準に解決する。CLI と実行中のウインドウは
# 別プロセス (別 cwd) なので、cwd 基準だと互いに違う場所を指してしまうため。
#
# クエリファイルは <sqlfiles_dir>/<フォルダ名>/<name>.sql に保存される。
# フォルダ名は接続ごとに次のルールで決まる (接続 name は使わない):
#   - サーバーに folder_name を指定していればそれを使う
#   - 無ければ <host>_<engine>_<schema>_<user> を組み立てる
# 例: 上の dev-postgres は "localhost_postgres_development_db_dev_user"。
# folder_name を明示するとフォルダ名を固定できる (host 等を変えても移動しない):
#   - name: dev-postgres
#     folder_name: dev-pg
#     engine: postgres
#     ...
